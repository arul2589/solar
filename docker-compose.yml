# Solar platform: Postgres + API + worker + web (Caddy serves the React build and proxies /api).
# Dev:   docker compose up -d --build   -> http://localhost:8088
# Prod:  set SITE_ADDRESS=solar.<domain> and real secrets in .env; Caddy fetches HTTPS certificates.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: solar
      POSTGRES_USER: solar
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-solar-dev-password}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U solar -d solar"]
      interval: 5s
      retries: 20
    restart: unless-stopped

  api:
    build: ./backend
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://solar:${POSTGRES_PASSWORD:-solar-dev-password}@db:5432/solar
      SECRET_KEY: ${SECRET_KEY:-dev-only-secret-key-change-me-0123456789abcdef}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8088}
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-log}
      STORAGE_DIR: /data/storage
    volumes:
      - storage:/data/storage
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build: ./backend
    command: ["python", "-m", "app.worker"]
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://solar:${POSTGRES_PASSWORD:-solar-dev-password}@db:5432/solar
      SECRET_KEY: ${SECRET_KEY:-dev-only-secret-key-change-me-0123456789abcdef}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8088}
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-log}
      STORAGE_DIR: /data/storage
    volumes:
      - storage:/data/storage
    depends_on:
      api:
        condition: service_started
    restart: unless-stopped

  web:
    build:
      context: ./frontend
      args:
        VITE_DEFAULT_INSTALLER: ${SEED_INSTALLER_SLUG:-demo}
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    ports:
      - "${WEB_PORT:-8088}:80"
      - "${WEB_TLS_PORT:-8443}:443"
    volumes:
      - caddy_data:/data
    depends_on:
      - api
    restart: unless-stopped

volumes:
  pgdata:
  storage:
  caddy_data:
